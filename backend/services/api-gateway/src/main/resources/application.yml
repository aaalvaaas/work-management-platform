spring:
    application:
        name: api-gateway

    profiles:
        active: dev

    security:
        oauth2:
            resourceserver:
                jwt:
                    jwk-set-uri: ${WMP_JWKS_URI:http://localhost:8080/.well-known/jwks.json}
                    issuer-uri: ${WMP_JWT_ISSUER:wmp-platform-service}

    cloud:
        gateway:
            server:
                webflux:
                    routes:
                        -   id: platform-auth
                            uri: ${wmp.services.platform-url}
                            predicates:
                                -   Path=/api/v1/auth/**,/api/v1/registration/**
                            filters:
                                -   name: RequestRateLimiter
                                    args:
                                        key-resolver: "#{@clientKeyResolver}"
                                        redis-rate-limiter.replenishRate: ${wmp.rate-limit.auth.replenish-rate}
                                        redis-rate-limiter.burstCapacity: ${wmp.rate-limit.auth.burst-capacity}

                        -   id: platform
                            uri: ${wmp.services.platform-url}
                            predicates:
                                -   Path=/api/v1/health,/api/v1/users/**,/api/v1/organizations/**,/.well-known/jwks.json
                            filters:
                                -   name: RequestRateLimiter
                                    args:
                                        key-resolver: "#{@clientKeyResolver}"
                                        redis-rate-limiter.replenishRate: ${wmp.rate-limit.api.replenish-rate}
                                        redis-rate-limiter.burstCapacity: ${wmp.rate-limit.api.burst-capacity}

                        -   id: mail
                            uri: ${wmp.services.mail-url}
                            predicates:
                                -   Path=/api/v1/mails/**
                            filters:
                                -   name: RequestRateLimiter
                                    args:
                                        key-resolver: "#{@clientKeyResolver}"
                                        redis-rate-limiter.replenishRate: ${wmp.rate-limit.api.replenish-rate}
                                        redis-rate-limiter.burstCapacity: ${wmp.rate-limit.api.burst-capacity}

server:
    port: 8000

app:
    version: 0.1.0

wmp:
    services:
        platform-url: ${WMP_PLATFORM_URL:http://localhost:8080}
        mail-url: ${WMP_MAIL_URL:http://localhost:8082}

    cors:
        allowed-origins: ${WMP_ALLOWED_ORIGINS:http://localhost:5173}

    rate-limit:
        auth:
            replenish-rate: ${WMP_AUTH_RATE_LIMIT:5}
            burst-capacity: ${WMP_AUTH_RATE_BURST:10}

        api:
            replenish-rate: ${WMP_API_RATE_LIMIT:50}
            burst-capacity: ${WMP_API_RATE_BURST:100}
