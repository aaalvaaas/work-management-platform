spring:
    application:
        name: platform-service

    profiles:
        active: dev

    servlet:
        multipart:
            max-file-size: 5MB
            max-request-size: 5MB

server:
    port: 8080

app:
    version: 0.1.0

jwt:
    issuer: wmp-platform-service
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    key-id: ${JWT_KEY_ID:}
    private-key-location: ${JWT_PRIVATE_KEY_LOCATION:}
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION:}

auth:
    refresh-cookie:
        name: ${REFRESH_COOKIE_NAME:wmp_refresh}
        path: /api/v1/auth
        secure: ${REFRESH_COOKIE_SECURE:false}
        same-site: ${REFRESH_COOKIE_SAME_SITE:Lax}

internal-api:
    key: ${INTERNAL_API_KEY:local-internal-key-change-me}

encryption:
    key: ${ENCRYPTION_KEY:cUJtZFZzWnB4S2JMc1duVjNxVHlFZ0hhN2RQZ01rWnc=}

authorization:
    cache-ttl: ${AUTHORIZATION_CACHE_TTL:60s}

registration:
    email-confirmation-ttl: 24h
    invitation-ttl: 72h

nextcloud:
    enabled: ${NEXTCLOUD_ENABLED:false}
    base-url: ${NEXTCLOUD_BASE_URL:http://localhost:8081}
    admin-user: ${NEXTCLOUD_ADMIN_USER:}
    admin-password: ${NEXTCLOUD_ADMIN_PASSWORD:}
