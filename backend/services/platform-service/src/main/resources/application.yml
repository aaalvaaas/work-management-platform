spring:
    application:
        name: platform-service

    profiles:
        active: dev

server:
    port: 8080

app:
    version: 0.1.0

jwt:
    issuer: wmp-platform-service
    access-token-ttl: 15m
    refresh-token-ttl: 30d

registration:
    email-confirmation-ttl: 24h
    invitation-ttl: 72h
