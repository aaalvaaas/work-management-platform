spring:
    datasource:
        url: jdbc:postgresql://localhost:15432/platform_db
        username: wmp
        password: wmp

    data:
        redis:
            host: ${REDIS_HOST:localhost}
            port: ${REDIS_PORT:6379}
            timeout: 2s

logging:
    level:
        root: INFO

bootstrap:
    admin:
        isu-number: ${PLATFORM_ADMIN_ISU:100001}
        email: ${PLATFORM_ADMIN_EMAIL:admin@niuitmo.ru}
        last-name: ${PLATFORM_ADMIN_LAST_NAME:Администратор}
        first-name: ${PLATFORM_ADMIN_FIRST_NAME:Платформы}
        password: ${PLATFORM_ADMIN_PASSWORD:local-admin-password}
