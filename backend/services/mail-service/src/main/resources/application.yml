spring:
    application:
        name: mail-service

    profiles:
        active: dev

server:
    port: 8082

platform:
    base-url: ${WMP_PLATFORM_URL:http://localhost:8080}
    internal-key: ${INTERNAL_API_KEY:local-internal-key-change-me}
    timeout: 3s

mail:
    import:
        fixed-delay: 30000

app:
    version: 0.1.0
