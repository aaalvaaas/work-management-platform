spring:
    application:
        name: mail-service

    profiles:
        active: dev

    kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
    port: 8082

platform:
    base-url: ${WMP_PLATFORM_URL:http://localhost:8080}
    internal-key: ${INTERNAL_API_KEY:local-internal-key-change-me}
    timeout: 3s

mail:
    import:
        fixed-delay: 30000

app:
    version: 0.1.0

wmp:
    events:
        mail-parsed-topic: ${WMP_MAIL_PARSED_TOPIC:wmp.mail.parsed}
        partitions: 3
