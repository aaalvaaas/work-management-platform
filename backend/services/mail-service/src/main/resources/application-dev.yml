spring:
    datasource:
        url: jdbc:postgresql://localhost:15432/mail_db
        username: wmp
        password: wmp

logging:
    level:
        root: INFO

mail:
    imap:
        host: imap.mail.ru
        port: 993
        username: ${MAIL_USERNAME}
        password: ${MAIL_PASSWORD}
        folder: INBOX
        ssl: true

storage:
    endpoint: ${STORAGE_ENDPOINT}
    access-key: ${STORAGE_ACCESS_KEY}
    secret-key: ${STORAGE_SECRET_KEY}
    bucket: ${STORAGE_BUCKET}

