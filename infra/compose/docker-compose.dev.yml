services:
    postgres:
        image: postgres:17

        container_name: wmp-postgres

        restart: unless-stopped

        env_file:
            -   .env

        ports:
            -   "15432:5432"

        volumes:
            -   postgres-data:/var/lib/postgresql/data
            -   ../docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

        networks:
            -   wmp-network

    redis:
        image: redis:7-alpine

        container_name: wmp-redis

        restart: unless-stopped

        command: redis-server --appendonly yes

        ports:
            -   "6379:6379"

        volumes:
            -   redis-data:/data

        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5

        networks:
            -   wmp-network

    seaweedfs:
        image: chrislusf/seaweedfs:4.48

        container_name: wmp-seaweedfs

        restart: unless-stopped

        command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json

        ports:
            -   "8333:8333"

        volumes:
            -   seaweedfs-data:/data
            -   ../docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

        networks:
            -   wmp-network

    nextcloud:
        image: nextcloud:apache

        container_name: wmp-nextcloud

        restart: unless-stopped

        depends_on:
            postgres:
                condition: service_healthy

        env_file:
            -   .env

        environment:
            POSTGRES_HOST: postgres
            POSTGRES_DB: ${NEXTCLOUD_DB_NAME}
            POSTGRES_USER: ${NEXTCLOUD_DB_USER}
            POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
            NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
            NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}

        ports:
            -   "8081:80"

        volumes:
            - nextcloud-data:/var/www/html
            - ../docker/nextcloud/zz-disable-jit.ini:/usr/local/etc/php/conf.d/zz-disable-jit.ini:ro

        networks:
            -   wmp-network



volumes:
    postgres-data:

    redis-data:

    seaweedfs-data:

    nextcloud-data:


networks:

    wmp-network:
        driver: bridge
