services:

    postgres:
        image: postgres:17

        container_name: wmp-postgres

        restart: unless-stopped

        env_file:
            -   .env

        ports:
            -   "5432:5432"

        volumes:
            -   postgres-data:/var/lib/postgresql/data

        networks:
            -   wmp-network

volumes:

    postgres-data:


networks:

    wmp-network:
        driver: bridge
