services:
    postgres:
        image: postgres:17

        container_name: wmp-postgres

        restart: unless-stopped

        env_file:
            -   .env

        ports:
            -   "15432:5432"

        volumes:
            -   postgres-data:/var/lib/postgresql/data
            -   ../docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

        networks:
            -   wmp-network

    redis:
        image: redis:7-alpine

        container_name: wmp-redis

        restart: unless-stopped

        command: redis-server --appendonly yes

        ports:
            -   "6379:6379"

        volumes:
            -   redis-data:/data

        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5

        networks:
            -   wmp-network

    seaweedfs:
        image: chrislusf/seaweedfs:4.48

        container_name: wmp-seaweedfs

        restart: unless-stopped

        command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json

        ports:
            -   "8333:8333"

        volumes:
            -   seaweedfs-data:/data
            -   ../docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

        networks:
            -   wmp-network

    mongo:
        image: mongo:8.0

        container_name: wmp-mongo

        restart: unless-stopped

        env_file:
            -   .env

        environment:
            MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
            MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}

        ports:
            -   "27017:27017"

        volumes:
            -   mongo-data:/data/db

        healthcheck:
            test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })' > /dev/null 2>&1"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

        networks:
            -   wmp-network

    kafka:
        image: apache/kafka:3.9.1

        container_name: wmp-kafka

        restart: unless-stopped

        ports:
            -   "9092:9092"

        environment:
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
            KAFKA_LOG_DIRS: /var/lib/kafka/data

        volumes:
            -   kafka-data:/var/lib/kafka/data

        healthcheck:
            test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
            interval: 10s
            timeout: 10s
            retries: 10
            start_period: 20s

        networks:
            -   wmp-network

    nextcloud:
        image: nextcloud:apache

        container_name: wmp-nextcloud

        restart: unless-stopped

        depends_on:
            postgres:
                condition: service_healthy

        env_file:
            -   .env

        environment:
            POSTGRES_HOST: postgres
            POSTGRES_DB: ${NEXTCLOUD_DB_NAME}
            POSTGRES_USER: ${NEXTCLOUD_DB_USER}
            POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
            NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
            NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}

        ports:
            -   "8081:80"

        volumes:
            - nextcloud-data:/var/www/html
            - ../docker/nextcloud/zz-disable-jit.ini:/usr/local/etc/php/conf.d/zz-disable-jit.ini:ro

        networks:
            -   wmp-network



volumes:
    postgres-data:

    redis-data:

    seaweedfs-data:

    kafka-data:

    mongo-data:

    nextcloud-data:


networks:

    wmp-network:
        driver: bridge
