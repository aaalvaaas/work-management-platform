name: frontend

on:
    push:
        branches: [dev, main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: frontend-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: build and test
        runs-on: ubuntu-latest
        timeout-minutes: 10

        defaults:
            run:
                working-directory: frontend

        steps:
            -   name: checkout
                uses: actions/checkout@v4

            -   name: set up node 24
                uses: actions/setup-node@v4
                with:
                    node-version: '24'
                    cache: npm
                    cache-dependency-path: frontend/package-lock.json

            -   name: install dependencies
                run: npm ci

            -   name: typecheck
                run: npm run typecheck

            -   name: test
                run: npm test

            -   name: build
                run: npm run build
