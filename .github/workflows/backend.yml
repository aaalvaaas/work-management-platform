name: backend

on:
    push:
        branches: [dev, main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: backend-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: build and test
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            -   name: checkout
                uses: actions/checkout@v4

            -   name: set up jdk 21
                uses: actions/setup-java@v4
                with:
                    distribution: temurin
                    java-version: '21'
                    cache: maven

            -   name: build and test
                working-directory: backend
                run: mvn --batch-mode --no-transfer-progress verify

            -   name: upload test reports
                if: failure()
                uses: actions/upload-artifact@v4
                with:
                    name: surefire-reports
                    path: backend/services/*/target/surefire-reports/
                    retention-days: 7
